name: voting-client
x-service: &service
  image: voting-client:${VOTING_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      SOURCE_REVISION: ${SOURCE_REVISION:-UNSPECIFIED}
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=1g,uid=10001,gid=10001,mode=0700
  volumes:
    - voting-state:/srv/voting/state
    - voting-logs:/srv/voting/logs
    - ${VOTING_MODEL_DIRECTORY:?Set VOTING_MODEL_DIRECTORY}:/srv/voting/models:ro
  environment: &environment
    VOTING_USERS_FILE: /run/secrets/users
    VOTING_PUBLIC_ORIGIN: ${VOTING_PUBLIC_ORIGIN:?Set the exact HTTPS origin}
    TRAINING_EXECUTION_ENABLED: ${TRAINING_EXECUTION_ENABLED:-false}
    AUTOMATION_ENABLED: "false"
  secrets: [users]
  networks: [local]
  restart: unless-stopped
  stop_grace_period: 10m
  pids_limit: 512
  mem_limit: ${VOTING_MEMORY_LIMIT:-32g}
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
services:
  api:
    <<: *service
  worker:
    <<: *service
    command: [python, -m, production.worker]
    healthcheck: {disable: true}
  tls:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["${VOTING_BIND_ADDRESS:-127.0.0.1}:${VOTING_PORT:-8443}:8443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${VOTING_TLS_DIRECTORY:?Set VOTING_TLS_DIRECTORY}:/etc/voting-tls:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, --no-check-certificate, "https://127.0.0.1:8443/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [local, edge]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
networks:
  local: {internal: true}
  edge: {}
volumes:
  voting-state:
  voting-logs:
secrets:
  users:
    file: ${VOTING_USERS_SECRET:?Set VOTING_USERS_SECRET}
